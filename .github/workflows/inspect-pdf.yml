name: Build Blender texturing workshop
on:
  push:
    branches:
      - trabajo-taller-texturing
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Blender starter files
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender >/dev/null
          blender --background --python scripts/inspect_blender.py
